name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway:
    name: gateway (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/gateway/package-lock.json

      - run: npm ci
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"
      - name: Unit tests
        run: npm test -- --ci
      - name: Build
        run: npm run build

  geo-service:
    name: geo-service (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/geo-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/geo-service/requirements.txt

      # geopandas -> pyogrio/shapely need GDAL/GEOS at the OS level
      - name: Install GDAL/GEOS
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev

      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          DATABASE_PATH: ${{ runner.temp }}/vitalens-test.duckdb
        run: pytest -q

  frontend:
    name: frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npx oxlint
      - name: Build
        run: npm run build
