# Requires an ingress controller (e.g. ingress-nginx) already
# installed on the cluster. Swap the host + tls block for your
# real domain once you have one - fine to delete both while testing
# locally and hitting the Service via port-forward instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitalens-ingress
  namespace: vitalens
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: api.vitalens.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
