# Copy to 01-gateway-secret.yaml, fill in real values, and DO NOT commit
# that copy (it's covered by .gitignore already).
#
#   kubectl create secret generic gateway-secrets \
#     --namespace vitalens \
#     --from-literal=MONGODB_URI='mongodb://...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=ADMIN_EMAIL='admin@vitalens.local' \
#     --from-literal=ADMIN_PASSWORD_HASH='...'
#
# ...or apply this file once it's filled in with base64 values:
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: vitalens
type: Opaque
stringData:
  MONGODB_URI: "mongodb://mongo:27017/vitalens"
  JWT_SECRET: "change-me"
  ADMIN_EMAIL: "admin@vitalens.local"
  ADMIN_PASSWORD_HASH: ""
